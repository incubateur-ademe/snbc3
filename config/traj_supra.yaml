# config/traj_supra.yaml
# =============================================================================
# Correspondance des sous-secteurs de la trajectoire nationale SNBC3 ("Traj_supra")
# vers les pivots EPCI, les corrections (démographie / DJU) et les indicateurs
# de recalage (énergie-climat, ALDO).
#
# SOURCE DE VÉRITÉ de la *correspondance* (pivot, flags, recalage). Les *valeurs*
# annuelles nationales (2020->2050) proviennent d'un fichier séparé :
# data/input/SNBC3 retraitée.xlsx (cf. config.settings.SNBC3_RETRAITEE_PATH),
# appariées sur `code_traj_supra` (colonne D de l'onglet "SNBC3 retraitée HEX").
#
# Ce YAML est destiné à être synchronisé vers les colonnes de métadonnées de
# l'onglet Traj_supra du tableur cible (même logique que Catalogue_data_EPCI).
#
# Flags de correction :
#   influence_demographie : facteur démographique évolutif (croissance EPCI vs zone)
#   correction_dju_chaud  : facteur = DJU chaud territoire / moyenne de zone (statique)
#   correction_dju_froid  : facteur = DJU froid territoire / moyenne de zone (statique)
#
# code_recalage : indicateur observé servant à recaler le secteur en année de
#   référence (null = pas de recalage -> pass-through). Le recalage est effectué
#   au niveau du *secteur* : tous les sous-secteurs partageant le même
#   code_recalage sont sommés puis recalés ensemble.
#   Sources : EC_EMIS_* / EC_CONSO_* (énergie-climat), ALDO_UTCATF_* (UTCATF).
#
# Surcharges par zone, à deux niveaux :
#   - bloc `zones` ci-dessous : réglages valant pour toute une zone (corrections
#     DJU, secteurs désactivés, trajectoire dérivée) ;
#   - clé `zones` d'un sous-secteur : surcharge ponctuelle de ce sous-secteur
#     (`code_pivot` alternatif, `actif: false`).
# Aux deux niveaux, une clé peut désigner un groupe de zones (DROM, cf.
# config.settings.GROUPES_ZONES) : ses réglages valent pour chacune de ses
# zones (GUADELOUPE, MARTINIQUE...), qui peuvent les compléter ou les
# surcharger. Une zone absente de ces deux endroits se comporte comme
# l'hexagone.
# =============================================================================

meta:
  description: "SNBC3 run3"
  source_valeurs: "data/input/SNBC3 retraitée.xlsx"
  onglets: "cf. config.settings.SNBC3_SHEETS"
  annee_min: 2020
  annee_max: 2050
  unites:
    GES: "MtCO2e"
    conso: "TWh"

# =============================================================================
# Réglages par zone
#
# corrections_dju : désactivation d'une correction climatique sur TOUS les
#   sous-secteurs de la zone. Seule la valeur `false` a un effet : ce bloc peut
#   éteindre une correction, jamais en allumer une là où le sous-secteur ne la
#   prévoit pas.
# secteurs_desactives : secteurs entièrement retirés de la territorialisation
#   de la zone (données de pivot indisponibles).
# =============================================================================

zones:

  DROM:
    libelle: "Départements et régions d'outre-mer"

    # Corrections DJU désactivées, pour trois raisons cumulatives :
    #  - Antilles et Guyane ont un DJU chaud nul, donc un facteur de correction
    #    nul : le chauffage y serait annulé et la conservation de la trajectoire
    #    conso (non recalée, cf. ci-dessous) rompue d'environ un tiers ;
    #  - le DJU froid EPCI est dominé par l'altitude des stations Météo-France
    #    interpolées (le TCO, côte ouest réunionnaise, ressort plus bas que la
    #    CINOR alors qu'il est plus chaud) : les Hauts et les Bas de La Réunion
    #    sont dans les mêmes EPCI et ne peuvent pas être distingués à cette
    #    maille ;
    #  - Mayotte n'a aucune station, donc un facteur par défaut de 1 qui serait
    #    incohérent avec le 0 des Antilles.
    # Enjeu borné : le résidentiel pèse 3,9 % des émissions DROM et le chauffage
    # n'en est qu'une fraction. Conforme à la recommandation de l'étude de
    # faisabilité ADEME/Eco2 (mars 2026) et de la DR Océan Indien.
    corrections_dju:
      chaud: false
      froid: false

    # ALDO ne couvre pas les DROM et l'IGT du CITEPA est publié hors puits de
    # carbone : aucun pivot territorial disponible. À réactiver dès la sortie
    # de la version DROM d'ALDO.
    secteurs_desactives:
      - UTCATF

    # Trajectoire de chaque DROM, dérivée à l'exécution de celle du groupe
    # (onglet « SNBC3 retraitée DROM », seul retraité dans le classeur) :
    #
    #   N_zone(ss,t) = N_DROM(ss,t) × P(ss) × D(t) × k(secteur,t)
    #
    #  - P : part de la zone dans le pivot du sous-secteur (total de la zone /
    #    total DROM, année de référence). Mayotte n'est pas territorialisée
    #    (cf. config.settings.ZONES_TERRITORIALISEES) mais reste dans le total
    #    DROM. Là où un pivot ne la couvre pas (MEN, RP*, EMP_TER, EMP_IND_*,
    #    absents des bases INSEE), le total DROM ne compte pas sa part et les
    #    quatre autres DROM se partageraient 100 % d'une trajectoire qui
    #    l'inclut : P est alors multiplié par (1 - part de Mayotte dans la
    #    conso du secteur), prise dans les bilans à `annee_part_hors_perimetre`.
    #    Part énergétique et non démographique : Mayotte pèse nettement plus
    #    en habitants qu'en énergie.
    #  - D : dérive démographique de la zone par rapport au groupe
    #    (POP_PROJ_RATIO), pour les sous-secteurs `influence_demographie`. Le
    #    facteur démographique par EPCI étant désormais normalisé sur la zone,
    #    D restitue l'écart de croissance entre DROM.
    #  - k : calage de la conso (`types_cales`) sur les bilans DGEC par
    #    territoire. Pour chaque secteur de `secteurs`, Σ des sous-secteurs de
    #    la zone = trajectoire DROM du secteur × part de la zone dans le bilan
    #    (colonne Total tous vecteurs), interpolée entre les années des bilans
    #    (2019, puis tous les 5 ans jusqu'à 2050). Le pivot unique de zone
    #    supposait une conso par ménage ou par emploi homogène entre DROM ; les
    #    bilans le démentent en niveau (industrie Guyane : -78 % en 2019 par
    #    rapport à son poids en emplois industriels) comme en dynamique
    #    (tertiaire 2050, base 2019 : 44 en Martinique, 126 en Guyane).
    #
    # Sans k, le découpage en zones reproduit exactement la territorialisation
    # sur le groupe entier : la branche GES, recalée sur l'IGT, n'en est pas
    # affectée. Déchets et Branche énergie ne sont pas calés (pas de ligne
    # dans les bilans). Le partage entre sous-secteurs d'un même secteur reste
    # celui des pivots.
    #
    # SOURCE. Le pipeline lit les parts dans l'onglet `onglet_parts` du
    # classeur publié. scripts/publier_snbc3.py les calcule depuis les onglets
    # de bilans du classeur de travail (groupe ici, zones via `onglet_bilan`) :
    # un onglet manquant, ou une somme des zones qui s'écarte du bilan du
    # groupe de plus de 0,1 %, y lève une erreur. Le pipeline revérifie que
    # les parts somment à 1 par secteur et par année.
    trajectoire_derivee:
      onglet_parts: "Parts bilans DROM"
      onglet_bilan_groupe: "Bilans énergie DROM"
      types_cales: [conso]
      annee_part_hors_perimetre: 2019    # la plus proche de ANNEE_REF
      # Secteur traj_supra -> libellé du bilan (colonne C du bloc annuel)
      secteurs:
        Résidentiel: "Résidentiel"
        Tertiaire:   "Tertiaire"
        Industrie:   "Industrie"
        Transports:  "Transport"
        Agriculture: "Agriculture"
      # Pas de ligne CSC dans les bilans : part de l'industrie retenue, le
      # captage étant un procédé industriel. Sans effet à ce jour, la
      # trajectoire CSC des DROM étant nulle sur toute la période.
      alias:
        CSC: Industrie

  # Zones du groupe DROM : elles héritent du bloc ci-dessus.
  GUADELOUPE:
    onglet_bilan: "Bilans énergie Guadeloupe"
  MARTINIQUE:
    onglet_bilan: "Bilans énergie Martinique"
  GUYANE:
    onglet_bilan: "Bilans énergie Guyane"
  REUNION:
    onglet_bilan: "Bilans énergie Réunion"
  # Hors périmètre v1 (pivots INSEE absents, cf. ZONES_TERRITORIALISEES) :
  # son bilan sert seulement à la correction P ci-dessus.
  MAYOTTE:
    onglet_bilan: "Bilans énergie Mayotte"

