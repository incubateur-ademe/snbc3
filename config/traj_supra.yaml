    influence_demographie: false
    correction_dju_chaud: false
    correction_dju_froid: false
    code_recalage: ALDO_UTCATF_CULT
    mode_additif: true
  - code_traj_supra: emi_UTCATF_prai
    type: GES
    secteur: UTCATF
    usage: "Prairies"
    code_pivot: ALDO_UTCATF_PRAI
    influence_demographie: false
    correction_dju_chaud: false
    correction_dju_froid: false
    code_recalage: ALDO_UTCATF_PRAI
    mode_additif: true
  - code_traj_supra: emi_UTCATF_zohu
    type: GES
    secteur: UTCATF
    usage: "Zones humides"
    code_pivot: ALDO_UTCATF_ZOHU
    influence_demographie: false
    correction_dju_chaud: false
    correction_dju_froid: false
    code_recalage: ALDO_UTCATF_ZOHU
    mode_additif: true
  - code_traj_supra: emi_UTCATF_arti
    type: GES
