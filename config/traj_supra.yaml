    correction_dju_froid: false
    code_recalage: EC_EMIS_AGRICULTURE

  # --- GES : Transports ----------------------------------------------------
  - code_traj_supra: emi_mob_vp_domtra
    type: GES
    secteur: Transports
    usage: "Routier mobilité VP / domicile-travail"
    code_pivot: MOB_DT_EMISSIONS
    influence_demographie: true
    correction_dju_chaud: false
    correction_dju_froid: false
    code_recalage: EC_EMIS_TRANSPORT_ROUTIER
    zones:
      # La mobilité domicile-travail ne couvre aucun EPCI DROM. Le pivot bascule
      # sur le parc VP, déjà utilisé par emi_mob_vp_autre : les deux lignes
      # partagent alors le même ratio, ce qui équivaut à une ligne VP unique.
      # Cohérent avec l'étude de faisabilité, qui assimile tous les
      # déplacements des DROM à des déplacements locaux.
      DROM:
        code_pivot: PARC_VP
  - code_traj_supra: emi_mob_vp_autre
    type: GES
    secteur: Transports
    usage: "Routier mobilité VP / autres motifs"
    code_pivot: PARC_VP
    influence_demographie: true
    correction_dju_chaud: false
    correction_dju_froid: false
    code_recalage: EC_EMIS_TRANSPORT_ROUTIER
