  # --- GES : UTCATF (pivots + recalage ALDO) --------------------------------
  # Pivots et recalage basés sur les flux ALDO communaux agrégés par EPCI.
  # Convention : positif = émission, négatif = séquestration
  #
  # mode_additif : la territorialisation utilise une approche additive au lieu
  #   de multiplicative. Le delta national (année t vs ref) est mis à l'échelle
  #   de la base observée (|facteur de recalage|, 1 sans recalage) puis réparti
  #   au prorata du poids absolu du pivot territorial (|pivot_terr| / Sigma|pivot|).
  #   Garantit : (1) que chaque territoire évolue dans le même sens que le
  #   national, même si son point de départ est de signe opposé, et (2) que la
  #   somme des territoires = facteur de recalage x trajectoire nationale
  #   (facteur > 0), comme pour le recalage multiplicatif des autres secteurs.
  - code_traj_supra: emi_UTCATF_for
    type: GES
    secteur: UTCATF
    usage: "Forêts"
    code_pivot: ALDO_UTCATF_FOR
    influence_demographie: false
    correction_dju_chaud: false
    correction_dju_froid: false
    code_recalage: ALDO_UTCATF_FOR
    mode_additif: true
  - code_traj_supra: emi_UTCATF_cult
    type: GES
    secteur: UTCATF
    usage: "Cultures"
