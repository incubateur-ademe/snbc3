    # le lieu réel de circulation (fret longue distance/transit). Voir
    # docs/resultats_territorialises.md, "Limite connue : pivots PL et bus".
    code_pivot: PARC_PL
    influence_demographie: false
    correction_dju_chaud: false
    correction_dju_froid: false
    code_recalage: EC_EMIS_TRANSPORT_ROUTIER
  - code_traj_supra: emi_mob_vp_bus
    type: GES
    secteur: Transports
    usage: "Routier mobilité Bus & cars"
    # Pivot = parc bus/cars immatriculé (lieu résidence/siège social) : ne
    # reflète pas le lieu réel d'usage (autocars interurbains). Voir
    # docs/resultats_territorialises.md, "Limite connue : pivots PL et bus".
    code_pivot: PARC_BUS
    influence_demographie: true
    correction_dju_chaud: false
    correction_dju_froid: false
