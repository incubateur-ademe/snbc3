  # --- GES : CSC -----------------------------------------------------------
  # Le CSC SNBC3 regroupe trois postes (onglet retraité, lignes SECTEN
  # « Capture... ») : captage biogénique (BECCS) de la branche énergie et de
  # l'industrie, et captage direct dans l'air. Le captage fossile de
  # l'industrie n'en fait pas partie : il est déjà déduit des sous-secteurs
  # emi_ind_*. Pas de recalage, la technologie étant inexistante en année de
  # référence.
  # BECCS branche énergie : les futurs sites ne sont pas connus et les
  # émissions fossiles actuelles de la branche (pivot très lacunaire, concentré
  # sur quelques raffineries) n'en sont pas un bon indice. Réparti par
  # habitant comme le DAC.
  - code_traj_supra: emi_CSC_beccs_en
    type: GES
    secteur: CSC
    usage: "BECCS branche énergie"
    code_pivot: POP
    influence_demographie: true
    correction_dju_chaud: false
    correction_dju_froid: false
    code_recalage: null
  - code_traj_supra: emi_CSC_beccs_ind
    type: GES
    secteur: CSC
    usage: "BECCS industrie"
    code_pivot: EC_EMIS_INDUSTRIE_HORS_BE
    influence_demographie: false
    correction_dju_chaud: false
    correction_dju_froid: false
    code_recalage: null
  # Le DAC n'est rattaché à aucun site : levier national compensant les
  # émissions résiduelles, réparti à parts égales par habitant.
  - code_traj_supra: emi_CSC_dac
    type: GES
    secteur: CSC
    usage: "Captage direct dans l'air (DAC)"
    code_pivot: POP
    influence_demographie: true
    correction_dju_chaud: false
    correction_dju_froid: false
    code_recalage: null

