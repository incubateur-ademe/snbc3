  # -------------------------------------------------------------------------
  # CITEPA IGT - indicateur de diagnostic
  # Les émissions observées par secteur des EPCI DROM alimentent les codes
  # EC_EMIS_* ci-dessus (l'OREC ne couvre pas les DROM) ; seul l'indicateur
  # ci-dessous est propre à l'IGT. Il est hors total inventaire et ne sert ni
  # de pivot ni de recalage : il documente la part des soutes internationales,
  # concentrée sur les EPCI portuaires et aéroportuaires.
  # -------------------------------------------------------------------------

  - code: IGT_EMIS_TRANSPORT_INTL
    libelle: "Émissions GES - Soutes internationales (diagnostic, hors total)"
    unite: "ktCO2e/an"
    source: CITEPA_IGT
    thematique: energie_climat
    methode: somme_communes

  # -------------------------------------------------------------------------
