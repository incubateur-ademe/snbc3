  # -------------------------------------------------------------------------
  # PROJECTIONS DÉMOGRAPHIQUES (INSEE Omphale)
  # -------------------------------------------------------------------------

  - code: POP_PROJ_RATIO
    libelle: "Évolution démographique projetée (ratio vs année de référence)"
    unite: "ratio"
    source: INSEE_OMPHALE
    thematique: demographie
    methode: moyenne_pond_pop
    # Moyenne pondérée par pop de référence pour les agrégats France/Hexagone/DROM
    annees_disponibles: [2020, 2025, 2030, 2035, 2040, 2045, 2050, 2060, 2070]
