# config/indicateurs.yaml
# ========================
# Catalogue officiel des indicateurs produits dans bdd_epci.parquet.
#
# Champs de chaque entrée :
#   code          : identifiant unique (valeur de la colonne code_indicateur)
#   libelle       : label lisible pour affichage / rapport
#   unite         : unité de la valeur
#   source        : identifiant de la source (correspond au module sources/)
#   thematique    : regroupement thématique
#   methode       : méthode d'agrégation commune→EPCI ou de calcul
#                   - somme_communes      : somme des valeurs communales
#                   - moyenne_pond_pop    : moyenne pondérée par la population
#                   - donnee_directe_epci : donnée déjà à l'échelle EPCI
#                   - IDW_stations        : interpolation spatiale IDW depuis stations MF
#   annees_disponibles : liste d'années connues (indicative)
#   code_source   : code de la variable dans le fichier source (optionnel)
#
# Convention de nommage des codes :
#   - Majuscules, underscores
#   - Sans suffixe d'année (l'année est une dimension séparée dans le CSV)

indicateurs:

  # -------------------------------------------------------------------------
  # DÉMOGRAPHIE
  # -------------------------------------------------------------------------

  - code: POP
    libelle: "Population municipale"
    unite: "habitants"
    source: INSEE_RP
    thematique: demographie
    methode: somme_communes
    annees_disponibles: [2014, 2015, 2019, 2020, 2021]
    code_source: "P{aa}_POP"

  - code: MEN
    libelle: "Nombre de ménages"
    unite: "ménages"
    source: INSEE_RP
    thematique: demographie
    methode: somme_communes
    annees_disponibles: [2014, 2015, 2019, 2020, 2021]
    code_source: "C{aa}_MEN"

  - code: RP_MAISON
    libelle: "Résidences principales - maisons"
    unite: "logements"
    source: INSEE_RP
    thematique: logement
    methode: somme_communes
    code_source: "P{aa}_RPMAISON"

  - code: RP_APPART
    libelle: "Résidences principales - appartements"
    unite: "logements"
    source: INSEE_RP
    thematique: logement
    methode: somme_communes
    code_source: "P{aa}_RPAPPART"

  - code: RP
    libelle: "Résidences principales (total)"
    unite: "logements"
    source: INSEE_RP
    thematique: logement
    methode: calcul_derive
    formule: "RP_MAISON + RP_APPART"


  # -------------------------------------------------------------------------
  # ÉCONOMIE
  # -------------------------------------------------------------------------

  - code: EMP_CTS
    libelle: "Emplois commerce, transports et services hors administration"
    unite: "emplois"
    source: INSEE_RP
    thematique: economie
    methode: somme_communes
    code_source: "C{aa}_ACTOCC15P_CS3"

  - code: EMP_APESAS
    libelle: "Emplois administration, enseignement, santé, action sociale"
    unite: "emplois"
    source: INSEE_RP
    thematique: economie
    methode: somme_communes
    code_source: "C{aa}_ACTOCC15P_CS5"

  - code: EMP_TER
    libelle: "Emplois tertiaires (commerce, transports, services et administration)"
    unite: "emplois"
    source: INSEE_RP
    thematique: economie
    methode: calcul_derive
    formule: "EMP_CTS + EMP_APESAS"

  # -------------------------------------------------------------------------
  # INDUSTRIE (FLORES INSEE)
  # -------------------------------------------------------------------------

  - code: EMP_IND_METAUX
    libelle: "Emplois industrie - Métaux primaires"
    unite: "emplois"
    source: FLORES
    thematique: industrie
    methode: somme_communes
    annees_disponibles: [2017, 2019, 2020]

  - code: EMP_IND_CHIMIE
    libelle: "Emplois industrie - Chimie"
    unite: "emplois"
    source: FLORES
    thematique: industrie
    methode: somme_communes

  - code: EMP_IND_NONMET
    libelle: "Emplois industrie - Minéraux non métalliques"
    unite: "emplois"
    source: FLORES
    thematique: industrie
    methode: somme_communes

  - code: EMP_IND_IAA
    libelle: "Emplois industrie - Industries alimentaires (IAA)"
    unite: "emplois"
    source: FLORES
    thematique: industrie
    methode: somme_communes

  - code: EMP_IND_EQUIP
    libelle: "Emplois industrie - Équipements"
    unite: "emplois"
    source: FLORES
    thematique: industrie
    methode: somme_communes

  - code: EMP_IND_PAPIER
    libelle: "Emplois industrie - Papier-carton"
    unite: "emplois"
    source: FLORES
    thematique: industrie
    methode: somme_communes

  - code: EMP_IND_CONST
    libelle: "Emplois industrie - Construction"
    unite: "emplois"
    source: FLORES
    thematique: industrie
    methode: somme_communes

  - code: EMP_IND_AUTRES
    libelle: "Emplois industrie - Autres industries"
    unite: "emplois"
    source: FLORES
    thematique: industrie
    methode: somme_communes

  - code: EMP_IND
    libelle: "Emplois industrie - Total"
    unite: "emplois"
    source: FLORES
    thematique: industrie
    methode: calcul_derive
    formule: "EMP_IND_METAUX + EMP_IND_CHIMIE + EMP_IND_NONMET + EMP_IND_IAA + EMP_IND_EQUIP + EMP_IND_PAPIER + EMP_IND_CONST + EMP_IND_AUTRES"

  # -------------------------------------------------------------------------
  # AGRICULTURE (RPG 2020 + Recensement Agricole 2020, retraitement Solagro)
  # -------------------------------------------------------------------------

  - code: SAU
    libelle: "Superficie agricole utilisée"
