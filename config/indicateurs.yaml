  - code: EC_CONSO_TRANSPORT_ROUTIER
    libelle: "Consommation d'énergie finale - Transport routier"
    unite: "GWh"
    source: ENERGIE_CLIMAT
    thematique: energie_climat
    methode: donnee_directe_epci
    code_source: "0201.0105"
    annees_disponibles: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

  - code: EC_CONSO_AUTRE_TRANSPORT
