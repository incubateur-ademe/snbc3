  # Flux de GES liés à l'usage des sols, par catégorie SNBC UTCATF.
  # Source : ALDO v3 (scripts/extract_aldo.py)
  # -------------------------------------------------------------------------

  - code: ALDO_UTCATF_FOR
    libelle: "UTCATF - Forêts (biomasse + CAS)"
    unite: "ktCO2e/an"
    source: ALDO
    thematique: utcatf
