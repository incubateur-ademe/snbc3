    unite: "ha"
    source: AGRESTE_RA
    thematique: agriculture
    methode: somme_communes
    annees_disponibles: [2020]

  - code: CULT_SURF_NON_BIO
    libelle: "Surface cultivée non bio"
    unite: "ha"
    source: AGRESTE_RA
    thematique: agriculture
    methode: somme_communes
    annees_disponibles: [2020]

  - code: SURF_PRAIRIES
    libelle: "Surface en prairies"
    unite: "ha"
    source: AGRESTE_RA
    thematique: agriculture
    methode: somme_communes
    annees_disponibles: [2020]

  # -------------------------------------------------------------------------
  # CLIMATIQUE (Météo-France - DJU annuels)
  # -------------------------------------------------------------------------

  - code: DJU_CHAUD_METEO
    libelle: "Degrés-Jours Unifiés chauffage (méthode Météo, seuil 17 °C)"
    unite: "°C·jour"
    source: METEO_FRANCE
    thematique: climatique
    methode: moyenne_pond_pop
    # IDW depuis stations MF vers centroïde EPCI, puis moyenne pondérée pour agrégats FR/hexagone/DROM
    seuil_ref_c: 17.0  # SDES mars 2025 (cf. sources/dju.py)
    annees_disponibles: [1996, 2024]  # plage historique

  - code: DJU_FROID_METEO
    libelle: "Degrés-Jours Unifiés climatisation (méthode Météo, seuil 21 °C)"
    unite: "°C·jour"
    source: METEO_FRANCE
    thematique: climatique
    methode: moyenne_pond_pop
    seuil_ref_c: 21.0  # SDES mars 2025 (cf. sources/dju.py)

  - code: DJU_CHAUD_COSTIC
    libelle: "Degrés-Jours Unifiés chauffage (méthode COSTIC, seuil 17 °C)"
    unite: "°C·jour"
    source: METEO_FRANCE
    thematique: climatique
    methode: moyenne_pond_pop
    seuil_ref_c: 17.0  # SDES mars 2025 (cf. sources/dju.py)

  - code: DJU_FROID_COSTIC
    libelle: "Degrés-Jours Unifiés climatisation (méthode COSTIC, seuil 21 °C)"
    unite: "°C·jour"
    source: METEO_FRANCE
    thematique: climatique
    methode: moyenne_pond_pop
    seuil_ref_c: 21.0  # SDES mars 2025 (cf. sources/dju.py)

  # -------------------------------------------------------------------------
  # MOBILITÉ DOMICILE-TRAVAIL (INSEE × SDES - source officielle)
  # Émissions et consommations individuelles estimées par commune de résidence,
  # agrégées depuis les données de navettage du recensement de la population.
  # Périmètre : déplacements domicile-travail, tous modes motorisés.
  # -------------------------------------------------------------------------

  - code: MOB_DT_EMISSIONS
    libelle: "Émissions GES mobilité domicile-travail"
    unite: "ktCO2e/an"
    source: MOBILITE_DT
    thematique: mobilite
    methode: somme_communes
