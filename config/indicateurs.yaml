  - code: MOB_DT_CONSO_FINALE
    libelle: "Consommation finale mobilité domicile-travail"
    unite: "GWh/an"
    source: MOBILITE_DT
    thematique: mobilite
    methode: somme_communes
    annees_disponibles: [2019, 2021, 2022]

  # -------------------------------------------------------------------------
  # PARC DE VÉHICULES ROUTIERS (SDES - RSVERO, données communales publiques,
  # jeu data.gouv « parc-de-vehicules-routiers »)
  # Nombre de véhicules immatriculés au 1er janvier de l'année, par commune.
  # Catégories : VP (voitures particulières), VUL (utilitaires légers),
  #              PL (poids lourds / camions), BUS (autobus et autocars).
  # -------------------------------------------------------------------------

  - code: PARC_VP
    libelle: "Parc de voitures particulières"
    unite: "véhicules"
    source: PARC_VEHICULES
    thematique: mobilite
    methode: somme_communes

  - code: PARC_VUL
